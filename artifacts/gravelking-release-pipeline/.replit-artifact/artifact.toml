kind = "slides"
previewPath = "/gravelking-release-pipeline/"
title = "GravelKing Pro — Studio, Proof & Release"
description = "A combined release-readiness, certificate pipeline, F6S, B2B, and business-concept presentation for GravelKing Pro."
version = "1.0.0"
id = "artifacts/gravelking-release-pipeline"
router = "path"

[[services]]
name = "web"
paths = [ "/gravelking-release-pipeline/" ]
localPort = 25817

[services.development]
run = "pnpm --filter @workspace/gravelking-release-pipeline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gravelking-release-pipeline", "run", "build" ]
serve = "static"
publicDir = "artifacts/gravelking-release-pipeline/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25817"
BASE_PATH = "/gravelking-release-pipeline/"
