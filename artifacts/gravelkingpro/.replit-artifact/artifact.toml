kind = "web"
previewPath = "/"
title = "GravelKing Pro"
version = "1.0.0"
id = "artifacts/gravelkingpro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19390

[services.development]
run = "pnpm --filter @workspace/gravelkingpro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gravelkingpro", "run", "build" ]
publicDir = "artifacts/gravelkingpro/dist/public"
serve = "static"

# Exact rewrites for every prerendered route — each must serve its own
# route-specific SEO HTML. These MUST stay ahead of the /* fallback.
[[services.production.rewrites]]
from = "/pricing"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/voice-removal"
to = "/mastering.html"

[[services.production.rewrites]]
from = "/mastering"
to = "/mastering.html"

[[services.production.rewrites]]
from = "/studio"
to = "/studio.html"

[[services.production.rewrites]]
from = "/songwriting"
to = "/songwriting.html"

[[services.production.rewrites]]
from = "/vocal-booth"
to = "/vocal-booth.html"

[[services.production.rewrites]]
from = "/download"
to = "/download.html"

[[services.production.rewrites]]
from = "/verify"
to = "/verify.html"

[[services.production.rewrites]]
from = "/whitepaper"
to = "/whitepaper.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact.html"

[[services.production.rewrites]]
from = "/label"
to = "/label.html"

[[services.production.rewrites]]
from = "/label/*"
to = "/label.html"

[[services.production.rewrites]]
from = "/submit"
to = "/submit.html"

[[services.production.rewrites]]
from = "/optimizer"
to = "/optimizer.html"

[[services.production.rewrites]]
from = "/convert"
to = "/convert.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19390"
BASE_PATH = "/"
