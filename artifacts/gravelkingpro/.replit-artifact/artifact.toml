kind = "web"
previewPath = "/"
title = "GravelKing Pro"
version = "1.0.0"
id = "artifacts/gravelkingpro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19390

[services.development]
run = "pnpm --filter @workspace/gravelkingpro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gravelkingpro", "run", "build" ]
publicDir = "artifacts/gravelkingpro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/voice-removal"
to = "/voice-removal.html"

[[services.production.rewrites]]
from = "/mastering"
to = "/mastering.html"

[[services.production.rewrites]]
from = "/download"
to = "/download.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact.html"

[[services.production.rewrites]]
from = "/label"
to = "/label.html"

[[services.production.rewrites]]
from = "/label/*"
to = "/label.html"

[[services.production.rewrites]]
from = "/library"
to = "/library.html"

[[services.production.rewrites]]
from = "/submit"
to = "/submit.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19390"
BASE_PATH = "/"
