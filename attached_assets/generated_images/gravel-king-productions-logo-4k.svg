<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Gravel King Productions</title>
  <desc id="desc">Premium black and gold production company logo with a crown-shaped lightning mark.</desc>
  <defs>
